name: Watchdog (every minute)

# Watches every stock the auto-trader holds once a minute during US market hours: risk group
# (safe / low / high), sell line, Alpaca stop order, evening rule. One job runs at a time and
# keeps looping until the close. Outside market hours it stays awake (sleeps and hands over to the next
# watchdog), wakes itself 6 minutes before the open and starts a fresh scan, so the open never depends on
# GitHub's scheduler, which can be hours late. The schedules below only restart the chain if it breaks.
on:
  schedule:
    - cron: "28 13-20 * * 1-5"
    - cron: "7,17,37,47 12,13,14 * * 1-5"   # extra tries before the open (summer and winter time)
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # start the 5-minute dashboard run and the next watchdog itself

# No concurrency group: GitHub queued the hourly backup runs behind the running watchdog, then refused to
# start its hand-over ("startup_failure") and failed the queued ones ("No jobs were run"). Instead each
# watchdog checks for an older running one at start and stops if there is one (watchdog.py).

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || vars.ALPACA_PAPER || 'true' }}
      AUTOTRADE: ${{ vars.AUTOTRADE || secrets.AUTOTRADE || 'off' }}
      AUTOTRADE_STOP_LOSS_PCT: ${{ vars.AUTOTRADE_STOP_LOSS_PCT || '5' }}
      AUTOTRADE_TRAIL_ARM_PCT: ${{ vars.AUTOTRADE_TRAIL_ARM_PCT || '1' }}
      AUTOTRADE_TRAIL_PCT: ${{ vars.AUTOTRADE_TRAIL_PCT || '5' }}
      AUTOTRADE_LINE_SAFE_PCT: ${{ vars.AUTOTRADE_LINE_SAFE_PCT || '5' }}
      AUTOTRADE_LINE_LOW_PCT: ${{ vars.AUTOTRADE_LINE_LOW_PCT || '5' }}
      AUTOTRADE_LINE_HIGH_PCT: ${{ vars.AUTOTRADE_LINE_HIGH_PCT || '5' }}
      AUTOTRADE_FLATTEN: ${{ vars.AUTOTRADE_FLATTEN || 'false' }}
      AUTOTRADE_FLATTEN_MINUTES: ${{ vars.AUTOTRADE_FLATTEN_MINUTES || '30' }}
      AUTOTRADE_KEEP_OVERNIGHT_PCT: ${{ vars.AUTOTRADE_KEEP_OVERNIGHT_PCT || '5' }}
      # Style: swing (hold for days) | scalp (minutes, +1% target, -0.7% stop, bigger trades after wins)
      AUTOTRADE_STYLE: ${{ vars.AUTOTRADE_STYLE || 'scalp' }}
      AUTOTRADE_SCALP_TP_PCT: ${{ vars.AUTOTRADE_SCALP_TP_PCT || '1' }}
      AUTOTRADE_SCALP_SL_PCT: ${{ vars.AUTOTRADE_SCALP_SL_PCT || '0.7' }}
      AUTOTRADE_SCALP_MAX_HOLD_MIN: ${{ vars.AUTOTRADE_SCALP_MAX_HOLD_MIN || '60' }}
      AUTOTRADE_SCALP_COOLDOWN_MIN: ${{ vars.AUTOTRADE_SCALP_COOLDOWN_MIN || '30' }}
      AUTOTRADE_SCALP_MAX_LOSSES: ${{ vars.AUTOTRADE_SCALP_MAX_LOSSES || '3' }}
      AUTOTRADE_STREAK_STEP_PCT: ${{ vars.AUTOTRADE_STREAK_STEP_PCT || '25' }}
      AUTOTRADE_STREAK_MAX_MULT: ${{ vars.AUTOTRADE_STREAK_MAX_MULT || '2' }}
      # Adaptive scalp: own target/stop per stock, auto switch to swing while scalp loses, no buys at the open
      AUTOTRADE_ADAPTIVE: ${{ vars.AUTOTRADE_ADAPTIVE || 'on' }}
      AUTOTRADE_SCALP_TP_MULT: ${{ vars.AUTOTRADE_SCALP_TP_MULT || '1' }}
      AUTOTRADE_SCALP_SL_MULT: ${{ vars.AUTOTRADE_SCALP_SL_MULT || '1' }}
      AUTOTRADE_SCALP_MIN_MOVE_PCT: ${{ vars.AUTOTRADE_SCALP_MIN_MOVE_PCT || '0.5' }}
      AUTOTRADE_ADAPT_TRADES: ${{ vars.AUTOTRADE_ADAPT_TRADES || '20' }}
      AUTOTRADE_ADAPT_RETRY_DAYS: ${{ vars.AUTOTRADE_ADAPT_RETRY_DAYS || '4' }}
      AUTOTRADE_SCALP_SKIP_OPEN_MIN: ${{ vars.AUTOTRADE_SCALP_SKIP_OPEN_MIN || '30' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Watch held stocks every minute until the close
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "trade-desk-bot@users.noreply.github.com"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          python3 .github/scripts/watchdog.py trade-records \
            "https://${owner}.github.io/${{ github.event.repository.name }}/trader-skill/trader-skill/data/agent.json" --minutes 350
