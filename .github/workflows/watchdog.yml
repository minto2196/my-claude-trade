name: Watchdog (every minute)

# Watches every stock the auto-trader holds once a minute during US market hours: risk group
# (safe / low / high), sell line, Alpaca stop order, evening rule. One job runs at a time and
# keeps looping until the close. Outside market hours it stays awake (sleeps and hands over to the next
# watchdog), wakes itself 6 minutes before the open and starts a fresh scan, so the open never depends on
# GitHub's scheduler, which can be hours late. The schedules below only restart the chain if it breaks.
on:
  schedule:
    - cron: "28 13-20 * * 1-5"
    - cron: "7,17,37,47 12,13,14 * * 1-5"   # extra tries before the open (summer and winter time)
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # start the 5-minute dashboard run and the next watchdog itself

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || vars.ALPACA_PAPER || 'true' }}
      AUTOTRADE: ${{ vars.AUTOTRADE || secrets.AUTOTRADE || 'off' }}
      AUTOTRADE_STOP_LOSS_PCT: ${{ vars.AUTOTRADE_STOP_LOSS_PCT || '5' }}
      AUTOTRADE_TRAIL_ARM_PCT: ${{ vars.AUTOTRADE_TRAIL_ARM_PCT || '0' }}
      AUTOTRADE_TRAIL_PCT: ${{ vars.AUTOTRADE_TRAIL_PCT || '5' }}
      AUTOTRADE_LINE_SAFE_PCT: ${{ vars.AUTOTRADE_LINE_SAFE_PCT || '5' }}
      AUTOTRADE_LINE_LOW_PCT: ${{ vars.AUTOTRADE_LINE_LOW_PCT || '5' }}
      AUTOTRADE_LINE_HIGH_PCT: ${{ vars.AUTOTRADE_LINE_HIGH_PCT || '5' }}
      AUTOTRADE_FLATTEN: ${{ vars.AUTOTRADE_FLATTEN || 'true' }}
      AUTOTRADE_FLATTEN_MINUTES: ${{ vars.AUTOTRADE_FLATTEN_MINUTES || '30' }}
      AUTOTRADE_KEEP_OVERNIGHT_PCT: ${{ vars.AUTOTRADE_KEEP_OVERNIGHT_PCT || '5' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Watch held stocks every minute until the close
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "trade-desk-bot@users.noreply.github.com"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          python3 .github/scripts/watchdog.py trade-records \
            "https://${owner}.github.io/${{ github.event.repository.name }}/trader-skill/trader-skill/data/agent.json" --minutes 350
