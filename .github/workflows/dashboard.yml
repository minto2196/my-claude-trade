name: Live dashboard

# Every run: Alpaca snapshot -> market scan (5 checks) -> time machine (weekly) -> auto-trader -> records -> supervisors -> site.
# GitHub runs scheduled jobs about every 5 minutes at best (often later). The extra Saturday 10:00 UTC
# schedule makes sure a run happens when the weekly report is due; the report logic itself catches up
# on anything due, so a late or skipped run never loses a report.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 10 * * 6"
    # Extra runs in the last half hour before the US close (covers both summer and winter time),
    # so the end-of-day sell-everything step is not left to a late scheduler.
    - cron: "32,40,47,54 19,20 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # commit trade records to the trade-records/ folder on main
  actions: write       # schedule supervisor reads runs; restarts the watchdog if it stopped
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a run off between placing an order and recording it

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || vars.ALPACA_PAPER || 'true' }}
      AUTOTRADE_SLOTS: ${{ vars.AUTOTRADE_SLOTS || '12' }}
      AGENT_BUY_NEEDS_PREDICTION: ${{ vars.AGENT_BUY_NEEDS_PREDICTION || 'true' }}
      AUTOTRADE_STOP_LOSS_PCT: ${{ vars.AUTOTRADE_STOP_LOSS_PCT || '5' }}
      AUTOTRADE_TAKE_PROFIT_PCT: ${{ vars.AUTOTRADE_TAKE_PROFIT_PCT || '0' }}
      AUTOTRADE_TRAIL_ARM_PCT: ${{ vars.AUTOTRADE_TRAIL_ARM_PCT || '1' }}
      AUTOTRADE_TRAIL_PCT: ${{ vars.AUTOTRADE_TRAIL_PCT || '5' }}
      AUTOTRADE_FLATTEN: ${{ vars.AUTOTRADE_FLATTEN || 'true' }}
      AUTOTRADE_FLATTEN_MINUTES: ${{ vars.AUTOTRADE_FLATTEN_MINUTES || '30' }}
      AUTOTRADE_KEEP_OVERNIGHT_PCT: ${{ vars.AUTOTRADE_KEEP_OVERNIGHT_PCT || '5' }}
      AUTOTRADE_LINE_SAFE_PCT: ${{ vars.AUTOTRADE_LINE_SAFE_PCT || '1' }}
      AUTOTRADE_LINE_LOW_PCT: ${{ vars.AUTOTRADE_LINE_LOW_PCT || '1' }}
      AUTOTRADE_LINE_HIGH_PCT: ${{ vars.AUTOTRADE_LINE_HIGH_PCT || '1' }}
      AUTOTRADE_SLOT_PCT: ${{ vars.AUTOTRADE_SLOT_PCT || '8.33' }}
      AUTOTRADE_SLOT_OF: ${{ vars.AUTOTRADE_SLOT_OF || 'split' }}   # split = free cash into 12 new stocks | account | cash
      AUTOTRADE_MAX_POSITIONS: ${{ vars.AUTOTRADE_MAX_POSITIONS || '100' }}
      AUTOTRADE_MIN_ORDER: ${{ vars.AUTOTRADE_MIN_ORDER || '5' }}
      AUTOTRADE_BAD_DAY_PCT: ${{ vars.AUTOTRADE_BAD_DAY_PCT || '3' }}
      AUTOTRADE_DAILY_LOSS_PCT: ${{ vars.AUTOTRADE_DAILY_LOSS_PCT || '5' }}
      AUTOTRADE_DAILY_TARGET_PCT: ${{ vars.AUTOTRADE_DAILY_TARGET_PCT || '20' }}   # up this much today -> sell all, stop for the day
      # Safety switch: on | off | auto (auto = off on paper, on with real money)
      AUTOTRADE_SAFETY_SWITCH: ${{ vars.AUTOTRADE_SAFETY_SWITCH || secrets.AUTOTRADE_SAFETY_SWITCH || 'auto' }}
      DATA: site/trader-skill/trader-skill/data
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot Alpaca account (read-only)
        run: python3 .github/scripts/alpaca_snapshot.py $DATA/portfolio.json

      # Scans the US market (~5000 observed, 500 shortlisted), runs the 5 checks and
      # writes buy / hold / start-selling signals. Read-only: it never places orders.
      - name: Verification agent (read-only)
        timeout-minutes: 8
        env:
          AGENT_WATCHLIST: ${{ vars.AGENT_WATCHLIST || '' }}
          AGENT_MAX_POSITION_PCT: ${{ vars.AGENT_MAX_POSITION_PCT || '10' }}
          AGENT_CASH_BUFFER_PCT: ${{ vars.AGENT_CASH_BUFFER_PCT || '10' }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          prev="https://${owner}.github.io/${{ github.event.repository.name }}/trader-skill/trader-skill/data/agent.json"
          python3 .github/scripts/agent_check.py $DATA/agent.json --portfolio $DATA/portfolio.json --previous "$prev" \
            --tm-cache trade-records/state/timemachine_stocks.json

      # LEVEL 0 TIME MACHINE (master switch). Every Saturday from 10:00 UTC, and whenever the last result
      # is missing or failed, replays the last ~6 months with the auto-trader's rules. If that would have
      # lost money, the auto-trader stops buying. Otherwise it just republishes the last result.
      - name: Time machine (weekly replay, master switch)
        timeout-minutes: 12
        continue-on-error: true
        run: python3 .github/scripts/backtest.py trade-records $DATA/agent.json $DATA

      # AUTO-TRADER. Places REAL orders when ALPACA_PAPER is false.
      # Kill switch: repository variable or secret AUTOTRADE = on | sell-only | sell-all (or no) | off (default off).
      # sell-all: no buys, cancels every open order and sells every position so it is all cash.
      - name: Auto-trader (kill switch AUTOTRADE)
        timeout-minutes: 4
        env:
          AUTOTRADE: ${{ vars.AUTOTRADE || secrets.AUTOTRADE || 'off' }}
          AUTOTRADE_ALLOW_ETF: ${{ vars.AUTOTRADE_ALLOW_ETF || 'false' }}
          AUTOTRADE_NO_BUY_MINUTES: ${{ vars.AUTOTRADE_NO_BUY_MINUTES || '30' }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          base="https://${owner}.github.io/${{ github.event.repository.name }}/trader-skill/trader-skill/data"
          mkdir -p trade-records/journal trade-records/state
          python3 .github/scripts/autotrader.py $DATA/trades.json --agent $DATA/agent.json --previous "$base/trades.json" \
            --journal trade-records/journal/journal.json --journal-previous trade-records/journal/journal.json \
            --state trade-records/state/peaks.json --backtest trade-records/state/backtest_latest.json

      # Weekly Excel (new file each Monday, newest 3 kept), weekly PDF from Saturday 10:00 UTC,
      # monthly report on the month's last Saturday. Stored in the trade-records/ folder on main.
      - name: Trade records and reports
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages openpyxl reportlab 2>/dev/null || python3 -m pip install --quiet openpyxl reportlab
          python3 .github/scripts/records.py trade-records $DATA/trades.json $DATA
          cp trade-records/state/watchdog.json $DATA/watchdog.json 2>/dev/null || true

      # Five supervisors check everything once an hour; results show at the bottom of the dashboard.
      - name: Supervisors (hourly)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/supervisor.py $DATA trade-records

      # Pushes made with the workflow's own token don't start another run, so this can't loop.
      # GitHub's scheduler can be hours late. If the market is open (or opening within 20 minutes) and
      # the every-minute watchdog isn't running, start it; the watchdog then starts this run every 5 minutes.
      - name: Keep the watchdog running
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/watchdog.py --ensure

      - name: Save trade records to GitHub (trade-records/ on main)
        continue-on-error: true
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "trade-desk-bot@users.noreply.github.com"
          git add trade-records
          if ! git diff --cached --quiet; then
            git commit -q -m "records: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Assemble site
        run: |
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' --exclude 'trade-records' ./ site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
