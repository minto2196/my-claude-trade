name: Live dashboard

# Refreshes the Alpaca snapshot and republishes the GitHub Pages site.
# GitHub runs scheduled jobs about every 5 minutes at best (often later).
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot Alpaca account (read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || vars.ALPACA_PAPER || 'true' }}
        run: python3 .github/scripts/alpaca_snapshot.py site/trader-skill/trader-skill/data/portfolio.json

      # Scans the US market (~5000 observed, 500 shortlisted), runs the 4 checks and
      # writes buy / hold / start-selling signals. Read-only: it never places orders.
      # The previous published agent.json carries the prediction log forward so calls get scored.
      - name: Verification agent (read-only)
        timeout-minutes: 8
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || vars.ALPACA_PAPER || 'true' }}
          AGENT_WATCHLIST: ${{ vars.AGENT_WATCHLIST || '' }}
          AGENT_MAX_POSITION_PCT: ${{ vars.AGENT_MAX_POSITION_PCT || '10' }}
          AGENT_CASH_BUFFER_PCT: ${{ vars.AGENT_CASH_BUFFER_PCT || '10' }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          prev="https://${owner}.github.io/${{ github.event.repository.name }}/trader-skill/trader-skill/data/agent.json"
          python3 .github/scripts/agent_check.py site/trader-skill/trader-skill/data/agent.json \
            --portfolio site/trader-skill/trader-skill/data/portfolio.json --previous "$prev"

      # AUTO-TRADER. Places REAL orders when ALPACA_PAPER is false.
      # Kill switch: repository variable or secret AUTOTRADE = on | sell-only | off (default off).
      - name: Auto-trader (kill switch AUTOTRADE)
        timeout-minutes: 4
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || vars.ALPACA_PAPER || 'true' }}
          AUTOTRADE: ${{ vars.AUTOTRADE || secrets.AUTOTRADE || 'off' }}
          AUTOTRADE_SLOTS: ${{ vars.AUTOTRADE_SLOTS || '12' }}
          AUTOTRADE_STOP_LOSS_PCT: ${{ vars.AUTOTRADE_STOP_LOSS_PCT || '8' }}
          AUTOTRADE_TAKE_PROFIT_PCT: ${{ vars.AUTOTRADE_TAKE_PROFIT_PCT || '20' }}
          AUTOTRADE_DAILY_LOSS_PCT: ${{ vars.AUTOTRADE_DAILY_LOSS_PCT || '5' }}
          AUTOTRADE_ALLOW_ETF: ${{ vars.AUTOTRADE_ALLOW_ETF || 'false' }}
          AUTOTRADE_NO_BUY_MINUTES: ${{ vars.AUTOTRADE_NO_BUY_MINUTES || '30' }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          base="https://${owner}.github.io/${{ github.event.repository.name }}/trader-skill/trader-skill/data"
          python3 .github/scripts/autotrader.py site/trader-skill/trader-skill/data/trades.json \
            --agent site/trader-skill/trader-skill/data/agent.json --previous "$base/trades.json" \
            --journal site/trader-skill/trader-skill/data/journal.json --journal-previous "$base/journal.json"

      # Trade journal: every auto-trader order with full details, as Excel and A4-landscape PDF.
      - name: Trade journal (Excel + PDF)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages openpyxl reportlab 2>/dev/null || python3 -m pip install --quiet openpyxl reportlab
          python3 .github/scripts/journal_report.py site/trader-skill/trader-skill/data/journal.json \
            site/trader-skill/trader-skill/data/trades.json site/trader-skill/trader-skill/data

      - name: Assemble site
        run: |
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
